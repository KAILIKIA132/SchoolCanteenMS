### Enhanced logging configuration for better tracking and debugging ###
log4j.rootLogger=DEBUG, file, stdout
#log4j.rootLogger=off

### direct log messages to stdout ###
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] (%F:%L) - %m%n

### direct messages to file with rolling ###
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/push-demo.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] (%F:%L) - %m%n

### Enhanced logging for specific packages ###
log4j.logger.com.zk=DEBUG
log4j.logger.com.zk.action=DEBUG
log4j.logger.com.zk.manager=DEBUG
log4j.logger.com.zk.dao=DEBUG
log4j.logger.com.zk.pushsdk=DEBUG
log4j.logger.com.zk.pushsdk.process=DEBUG
log4j.logger.com.zk.util=DEBUG
log4j.logger.com.zk.util.ExternalApiUtil=DEBUG
log4j.logger.org.apache.struts2=INFO
log4j.logger.com.opensymphony.xwork2=INFO
log4j.logger.org.apache=INFO

### Security and audit logging ###
log4j.logger.audit=INFO, auditFile
log4j.additivity.audit=false
log4j.appender.auditFile=org.apache.log4j.RollingFileAppender
log4j.appender.auditFile.File=logs/audit.log
log4j.appender.auditFile.MaxFileSize=10MB
log4j.appender.auditFile.MaxBackupIndex=5
log4j.appender.auditFile.layout=org.apache.log4j.PatternLayout
log4j.appender.auditFile.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] - %m%n
